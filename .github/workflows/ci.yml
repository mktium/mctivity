name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run release preflight
        run: ./scripts/mctivity-release-preflight.sh

      - name: Check patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...HEAD"
            python3 scripts/release_content_check.py --history "origin/$BASE_REF"
          else
            git diff --check HEAD^
            python3 scripts/release_content_check.py --history HEAD^
          fi
